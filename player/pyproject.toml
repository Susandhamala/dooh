[project]
name = "dooh-player"
version = "0.1.0"
description = "Screen player agent for Rentall Screen Ads"
requires-python = ">=3.11"
dependencies = ["pynacl>=1.5", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dooh-player = "dooh_player.agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
