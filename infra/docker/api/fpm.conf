; PHP-FPM pool. The image default (5 workers) queues requests as soon as a few people upload ads
; at once. Each worker can use up to memory_limit, so size PHP_FPM_MAX_CHILDREN to the server's RAM.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; A worker stuck longer than this is killed instead of holding a slot for ever.
request_terminate_timeout = 300
; Lets the container health check ask FPM directly.
ping.path = /fpm-ping
catch_workers_output = yes
decorate_workers_output = no
; Health checks every 30 s would fill the access log.
access.suppress_path[] = /fpm-ping
