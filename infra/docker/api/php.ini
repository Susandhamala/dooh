; Ad videos are up to 200 MB; PHP's defaults (2 MB) would refuse them before Laravel sees them.
upload_max_filesize = 210M
post_max_size = 220M
memory_limit = 512M
max_execution_time = 120
expose_php = Off

; Compiled PHP stays in memory. The code only changes when the image is rebuilt, so in production
; the entrypoint turns off the file checks (PHP_OPCACHE_VALIDATE=0).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE}
opcache.revalidate_freq = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
