# Lab version of the routing. In production the host Nginx does the same for ads.rentallnepal.com.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Portal + API for people.
server {
    listen 8080;
    server_name _;
    client_max_body_size 200m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Device routes are never reachable on the people-facing port.
    location /device/ {
        return 404;
    }

    location ~ ^/api/v1/(auth|sso)/ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DEVICE_CERT_FINGERPRINT "";
        fastcgi_pass api:9000;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DEVICE_CERT_FINGERPRINT "";
        fastcgi_pass api:9000;
    }
}

# Device endpoint: mutual TLS only. No valid client certificate, no connection.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.3;

    location /device/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        # Laravel checks this fingerprint against the devices table (and revoked_at) on every request.
        fastcgi_param DEVICE_CERT_FINGERPRINT $ssl_client_fingerprint;
        fastcgi_param DEVICE_CERT_SERIAL $ssl_client_serial;
        fastcgi_pass api:9000;
    }

    location / {
        return 404;
    }
}
