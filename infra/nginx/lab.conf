# The web container: portal files, the API for people (8080) and the mTLS device endpoint (8443).
# Production puts a host Nginx with the public TLS certificate in front of 8080
# (infra/nginx/host-ads.rentallnepal.com.conf); screens connect to 8443 directly.

server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;

# Look the API up through Docker's DNS on each request (not once at start), so rebuilding the api
# container doesn't leave Nginx pointing at its old address (502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

# Set by the host Nginx in front. Only then is the page HTTPS, and only then is HSTS sent.
map $http_x_forwarded_proto $forwarded_https {
    https   on;
    default "";
}
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Portal + API for people.
server {
    listen 8080;
    server_name _;
    client_max_body_size 220m;

    # Behind the host Nginx (Docker's bridge network), take the visitor's address from
    # X-Forwarded-For, so rate limits and logs see each visitor instead of one proxy.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Strict-Transport-Security $hsts always;
    # Scripts only from this site. Map tiles come from OpenStreetMap; ads and previews may be blob: URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    set $api_upstream api:9000;

    location / {
        try_files $uri /index.html;
    }

    # The app shell: always check for a new release.
    location = /index.html {
        expires epoch;
    }

    # Built files have a content hash in their name, so they can be cached for a year.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /photos/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /brand/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Device routes are never reachable on the people-facing port.
    location /device/ {
        return 404;
    }

    # Strict limit only where a password or code is guessed. me/refresh/logout run on every page
    # load, so they share the normal API limit (a few reloads must not sign anyone out).
    location ~ ^/api/v1/auth/(login|register|sso|phone/|mfa/) {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTPS $forwarded_https;
        fastcgi_param DEVICE_CERT_FINGERPRINT "";
        fastcgi_pass $api_upstream;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTPS $forwarded_https;
        fastcgi_param DEVICE_CERT_FINGERPRINT "";
        # Ad uploads (up to 200 MB) are checked with ffprobe before the response.
        fastcgi_read_timeout 300s;
        fastcgi_pass $api_upstream;
    }
}

# Device endpoint: mutual TLS. A certificate that doesn't chain to the device CA fails the handshake;
# no certificate at all reaches only the enrolment route, where a new device trades its one-time
# code for one.
server {
    listen 8443 ssl;
    server_name _;
    client_max_body_size 16k;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:device_tls:5m;
    set $api_upstream api:9000;

    location = /device/v1/enrol {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DEVICE_CERT_FINGERPRINT "";
        fastcgi_pass $api_upstream;
    }

    location /device/ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        # Laravel checks this fingerprint against the devices table (and revoked_at) on every request.
        fastcgi_param DEVICE_CERT_FINGERPRINT $ssl_client_fingerprint;
        fastcgi_param DEVICE_CERT_SERIAL $ssl_client_serial;
        fastcgi_pass $api_upstream;
    }

    location / {
        return 404;
    }
}
