# Host Nginx on the production server: public TLS for people, in front of the web container.
# Install: copy to /etc/nginx/sites-available/, link into sites-enabled, then
#   certbot --nginx -d ads.rentallnepal.com
# Screens do not come through here: they connect to port 8443 (mutual TLS) on the container directly.

server {
    listen 80;
    listen [::]:80;
    server_name ads.rentallnepal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ads.rentallnepal.com;

    # Filled in by certbot.
    ssl_certificate     /etc/letsencrypt/live/ads.rentallnepal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ads.rentallnepal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ads_tls:10m;
    server_tokens off;

    # Ad videos are up to 200 MB.
    client_max_body_size 220m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
